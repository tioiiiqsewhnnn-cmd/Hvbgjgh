<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة تهنئة يوم ميلاد</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(120deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card-container {
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 350px;
            min-height: 250px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            text-align: center;
            color: white;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card:hover {
            transform: scale(1.05) rotateY(10deg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .hidden-message {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.8s ease-in-out;
            font-size: 1.3em;
            line-height: 1.6;
            margin-top: 0;
        }

        .card.open .hidden-message {
            max-height: 200px;
            opacity: 1;
            margin-top: 20px;
        }

        .card.open .click-hint {
            display: none;
        }

        .click-hint {
            margin-top: 20px;
            font-size: 0.9em;
            opacity: 0.7;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.7; }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #fff;
            top: -10px;
            z-index: 10;
            border-radius: 50%;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="card-container" onclick="openCard()">
        <div class="card" id="birthdayCard">
            <h1>🎉 كل عام وأنت بخير! 🎂</h1>
            <div class="click-hint">(اضغط لفتح البطاقة)</div>
            <div class="hidden-message">
                أتمنى لك سنة جديدة مليئة بالسعادة، النجاح، وتحقيق كل أمنياتك. <br>
                ✨ العمر كله يا رب! ✨
            </div>
        </div>
    </div>

    <script>
        let isOpened = false;

        function openCard() {
            if (isOpened) return; 
            
            document.getElementById('birthdayCard').classList.add('open');
            isOpened = true;
            
            // إنشاء تأثير الاحتفال (Confetti)
            const colors = ['#FFC700', '#FF0000', '#2E3192', '#41BBC7', '#E84C3D'];
            
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    let confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    
                    // خصائص عشوائية لكل قطعة
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    // أشكال عشوائية (دوائر ومربعات)
                    if (Math.random() > 0.5) {
                        confetti.style.borderRadius = '0';
                    }
                    
                    // سرعة وحجم عشوائي
                    let size = Math.random() * 10 + 5;
                    confetti.style.width = size + 'px';
                    confetti.style.height = size + 'px';
                    
                    let duration = Math.random() * 3 + 2;
                    confetti.style.animation = `fall ${duration}s linear forwards`;
                    
                    document.body.appendChild(confetti);
                    
                    // إزالة القطع بعد انتهاء الحركة لتخفيف العبء على المتصفح
                    setTimeout(() => {
                        confetti.remove();
                    }, duration * 1000);
                    
                }, i * 30); // تأخير تدريجي لظهور القطع
            }
        }
    </script>
</body>
</html>
